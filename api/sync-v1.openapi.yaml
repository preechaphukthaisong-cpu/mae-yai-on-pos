openapi: 3.1.0
info:
  title: Maeyai-On-POS Multi-device Sync API
  version: 1.0.0
  description: >
    Offline-first store event synchronization and encrypted backup transport.
    Google ID tokens identify the store owner. Device-scoped routes require a
    registered X-Device-ID. The API never accepts plaintext SQLite backups.
servers:
  - url: https://SYNC_BACKEND_HOST
security:
  - googleIdToken: []
paths:
  /health:
    get:
      security: []
      responses:
        '200':
          description: Service and database are reachable
  /v1/stores:
    post:
      summary: Create or retrieve the store for the authenticated Google identity
      responses:
        '201':
          description: Store identity
  /v1/stores/me:
    get:
      summary: Read the store associated with the authenticated Google identity
      responses:
        '200':
          description: Store identity and latest event sequence
        '404':
          description: No store is registered
  /v1/devices:
    post:
      summary: Register an Android installation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, label, publicKey]
              properties:
                deviceId: { type: string, format: uuid }
                label: { type: string, minLength: 1, maxLength: 80 }
                publicKey: { type: string, description: "RSA-3072 DER SPKI encoded as canonical base64url" }
      responses:
        '201': { description: Device registered }
        '409': { description: Device ID belongs to another or revoked installation }
  /v1/devices/{deviceId}:
    delete:
      summary: Revoke another registered device
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Device revoked }
        '404': { description: Device not found }
  /v1/key-epochs/current:
    get:
      summary: Read the current store encryption key epoch
      responses:
        '200': { description: Current key epoch }
  /v1/key-epochs:
    post:
      summary: Atomically rotate the store key and enroll all remaining trusted devices
      parameters:
        - in: header
          name: X-Device-ID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyEpoch, wrappers, recoveryWrappedKey]
              properties:
                keyEpoch: { type: integer, minimum: 1 }
                wrappers: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DeviceKeyWrapper' } }
                recoveryWrappedKey: { type: string }
      responses:
        '200': { description: Key epoch committed }
        '409': { description: Key epoch is stale or out of order }
  /v1/key-wrappers:
    get:
      summary: Retrieve every historical key epoch wrapped for the authenticated device
      parameters:
        - in: header
          name: X-Device-ID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Per-device wrapped key history }
    post:
      summary: Approve a device for a key epoch already held by the approving device
      parameters:
        - in: header
          name: X-Device-ID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetDeviceId, keyEpoch, wrappedKey]
              properties:
                targetDeviceId: { type: string, format: uuid }
                keyEpoch: { type: integer, minimum: 1 }
                wrappedKey: { type: string }
      responses:
        '201': { description: Device key wrapper created }
        '403': { description: Approving device does not hold this epoch }
        '409': { description: Conflicting wrapper already exists }
  /v1/key-wrappers/current:
    get:
      summary: Retrieve the current store key wrapped for this device
      responses:
        '200': { description: Current per-device wrapped key }
        '409': { description: Device is not approved for the current key epoch }
  /v1/key-wrappers/recovery:
    get:
      summary: Retrieve a recovery-wrapped historical store key epoch
      parameters:
        - in: query
          name: epoch
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Recovery-wrapped store key; remains encrypted to the user recovery secret }
        '404': { description: Recovery wrapper not found }
  /v1/devices/{deviceId}/revoke:
    post:
      summary: Revoke another device while atomically rotating and re-wrapping the next store key
      parameters:
        - in: header
          name: X-Device-ID
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: deviceId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyEpoch, wrappers, recoveryWrappedKey]
              properties:
                keyEpoch: { type: integer, minimum: 1 }
                wrappers: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DeviceKeyWrapper' } }
                recoveryWrappedKey: { type: string }
      responses:
        '200': { description: Device revoked and new key epoch committed }
        '409': { description: Revocation requires a valid next epoch and complete active-device wrappers }
  /v1/sync/push:
    post:
      summary: Submit locally committed immutable events
      parameters:
        - in: header
          name: X-Device-ID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [eventId, operation, entityType, entityId, baseVersion, payload, payloadSha256]
                    properties:
                      eventId: { type: string, format: uuid }
                      operation: { type: string, enum: [upsert, delete] }
                      entityType: { type: string, maxLength: 64 }
                      entityId: { type: string, maxLength: 160 }
                      baseVersion: { type: integer, minimum: 0 }
                      payload:
                        type: object
                        required: [encryptionVersion, keyEpoch, algorithm, nonce, ciphertext, aadVersion]
                        properties:
                          encryptionVersion: { type: integer, const: 1 }
                          keyEpoch: { type: integer, minimum: 1 }
                          algorithm: { type: string, const: A256GCM }
                          nonce: { type: string, description: "12-byte base64url nonce" }
                          ciphertext: { type: string, description: "AES-256-GCM ciphertext plus 128-bit tag" }
                          aadVersion: { type: integer, const: 1 }
                      payloadSha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
      responses:
        '200': { description: Durable per-event acknowledgements and conflicts }
        '409': { description: Idempotency key reused with different content }
  /v1/sync/pull:
    get:
      summary: Read the authoritative ordered event log after a cursor
      parameters:
        - in: header
          name: X-Device-ID
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: after
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200': { description: Ordered event page and next cursor }
  /v1/conflicts:
    get:
      summary: List unresolved entity-version conflicts
      parameters:
        - in: header
          name: X-Device-ID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Unresolved conflicts }
  /v1/drive/connect:
    post:
      summary: Connect the same Google account's Drive appDataFolder
      parameters:
        - in: header
          name: X-Device-ID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serverAuthCode]
              properties:
                serverAuthCode: { type: string, minLength: 20, maxLength: 4096 }
      responses:
        '200': { description: Refresh token encrypted and Drive identity verified }
        '403': { description: Google account or Drive scope mismatch }
  /v1/backups:
    get:
      summary: List encrypted full snapshots
      parameters:
        - in: header
          name: X-Device-ID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Encrypted snapshot metadata }
    post:
      summary: Upload an encrypted full snapshot for the latest authoritative sequence
      parameters:
        - in: header
          name: X-Device-ID
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Through-Seq
          required: true
          schema: { type: integer, minimum: 0 }
        - in: header
          name: X-Backup-SHA256
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '202': { description: Encrypted snapshot stored; Drive mirror queued }
        '409': { description: Snapshot is not at the latest server event sequence }
  /v1/backups/{snapshotId}:
    get:
      summary: Download an encrypted snapshot for cross-device restore
      parameters:
        - in: header
          name: X-Device-ID
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: snapshotId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Encrypted backup bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { description: Snapshot not found }
components:
  schemas:
    DeviceKeyWrapper:
      type: object
      required: [deviceId, wrappedKey]
      properties:
        deviceId: { type: string, format: uuid }
        wrappedKey: { type: string, description: "RSA-OAEP wrapped 256-bit store key encoded as base64url" }
  securitySchemes:
    googleIdToken:
      type: http
      scheme: bearer
      bearerFormat: Google ID token
