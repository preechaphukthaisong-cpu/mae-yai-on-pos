services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: maeyai_sync
      POSTGRES_USER: maeyai_sync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
    volumes:
      - maeyai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maeyai_sync -d maeyai_sync"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://maeyai_sync:${POSTGRES_PASSWORD}@db:5432/maeyai_sync
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?Set GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_DRIVE_OAUTH_CLIENT_SECRET: ${GOOGLE_DRIVE_OAUTH_CLIENT_SECRET:?Set GOOGLE_DRIVE_OAUTH_CLIENT_SECRET}
      TOKEN_ENCRYPTION_KEY_BASE64: ${TOKEN_ENCRYPTION_KEY_BASE64:?Set a random 32-byte base64 key}
      BACKUP_RETENTION_FULL: ${BACKUP_RETENTION_FULL:-3}
      MAX_BACKUP_BYTES: ${MAX_BACKUP_BYTES:-134217728}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  maeyai-postgres:
