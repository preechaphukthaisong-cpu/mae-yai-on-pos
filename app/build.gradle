plugins { id 'com.android.application' }

def releaseStoreFile = System.getenv('MAEYAI_RELEASE_STORE_FILE')

android {
    namespace 'com.maeyaion.pos'
    compileSdk 36
    defaultConfig {
        applicationId 'com.maeyaion.pos'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.4.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }
    }
    signingConfigs {
        release {
            if (releaseStoreFile != null && !releaseStoreFile.trim().isEmpty()) {
                storeFile file(releaseStoreFile)
                storeType 'PKCS12'
                storePassword System.getenv('MAEYAI_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('MAEYAI_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('MAEYAI_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (releaseStoreFile != null && !releaseStoreFile.trim().isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.room:room-runtime:2.8.5'
    annotationProcessor 'androidx.room:room-compiler:2.8.5'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.room:room-testing:2.8.5'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.room:room-testing:2.8.5'
}
