plugins { id 'com.android.application' }

def releaseStoreFilePath = System.getenv('MAEYAI_RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('MAEYAI_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('MAEYAI_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('MAEYAI_RELEASE_KEY_PASSWORD')
def releaseSigningConfigured = releaseStoreFilePath &&
        releaseStorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword &&
        file(releaseStoreFilePath).isFile()

def releaseTaskRequested = gradle.startParameter.taskNames.any {
    def task = it.toLowerCase(Locale.ROOT)
    task.contains('assemblerelease') || task.contains('bundlerelease')
}
if (releaseTaskRequested && !releaseSigningConfigured) {
    throw new GradleException(
            'Release signing is not configured. Set MAEYAI_RELEASE_STORE_FILE, ' +
            'MAEYAI_RELEASE_STORE_PASSWORD, MAEYAI_RELEASE_KEY_ALIAS and ' +
            'MAEYAI_RELEASE_KEY_PASSWORD.'
    )
}

android {
    namespace 'com.maeyaion.pos'
    compileSdk 36
    defaultConfig {
        applicationId 'com.maeyaion.pos'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }
    }
    // Keep CI debug APK signing deterministic for the registered Android OAuth SHA-1.
    // Local builds retain Android Gradle Plugin's normal debug signing behavior.
    def ciDebugKeystore = file("${System.getProperty('user.home')}/.android/debug.keystore")
    if (System.getenv('CI') == 'true' && ciDebugKeystore.isFile()) {
        signingConfigs {
            debug {
                storeFile ciDebugKeystore
                storePassword 'android'
                keyAlias 'AndroidDebugKey'
                keyPassword 'android'
            }
        }
        buildTypes {
            debug {
                signingConfig signingConfigs.debug
            }
        }
    }
    if (releaseSigningConfigured) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.room:room-runtime:2.8.5'
    annotationProcessor 'androidx.room:room-compiler:2.8.5'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.room:room-testing:2.8.5'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.room:room-testing:2.8.5'
}
