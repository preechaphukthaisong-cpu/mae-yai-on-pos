name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" && -d "$SDK_ROOT/cmdline-tools" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [[ -z "$SDKMANAGER" && -x "$SDK_ROOT/tools/bin/sdkmanager" ]]; then
            SDKMANAGER="$SDK_ROOT/tools/bin/sdkmanager"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 4 -type d -print | head -n 80
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Using Android SDK: $SDK_ROOT"
          echo "Using sdkmanager: $SDKMANAGER"
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Run database instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34 is used for a more stable CI emulator; compile/target SDK remain 36.
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 4096
          disable-animations: true
          script: |
            set -euo pipefail
            adb wait-for-device

            echo "Waiting for Android package service..."
            PACKAGE_SERVICE_READY=false
            for attempt in $(seq 1 90); do
              if adb shell service check package 2>/dev/null | grep -q "found"; then
                echo "Android package service is ready (attempt $attempt)"
                PACKAGE_SERVICE_READY=true
                break
              fi
              sleep 2
            done

            if [ "$PACKAGE_SERVICE_READY" != "true" ]; then
              adb shell service list || true
              adb logcat -d -b all > "$RUNNER_TEMP/emulator-logcat.txt" || true
              echo "::error::Android package service did not become ready within 180 seconds"
              exit 1
            fi

            adb shell settings put global package_verifier_enable 0 || true
            adb shell settings put global verifier_verify_adb_installs 0 || true
            adb shell settings put global package_verifier_user_consent -1 || true

            set +e
            gradle --no-daemon :app:connectedDebugAndroidTest
            TEST_EXIT=$?
            set -e
            adb logcat -d -b all > "$RUNNER_TEMP/emulator-logcat.txt" || true
            if [ "$TEST_EXIT" -ne 0 ]; then
              echo "::error::Database instrumentation tests failed; emulator logcat captured"
              tail -n 160 "$RUNNER_TEMP/emulator-logcat.txt" || true
              exit "$TEST_EXIT"
            fi
      - name: Upload emulator logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mae-yai-on-pos-emulator-logcat
          path: ${{ runner.temp }}/emulator-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload Room schema
        uses: actions/upload-artifact@v4
        with:
          name: mae-yai-on-pos-room-schema
          path: app/schemas/
          if-no-files-found: error
          retention-days: 7
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mae-yai-on-pos-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
