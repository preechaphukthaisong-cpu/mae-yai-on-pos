name: Android Release Signing Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build and verify signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MAEYAI_RELEASE_KEYSTORE_BASE64: ${{ secrets.MAEYAI_RELEASE_KEYSTORE_BASE64 }}
      MAEYAI_RELEASE_STORE_PASSWORD: ${{ secrets.MAEYAI_RELEASE_STORE_PASSWORD }}
      MAEYAI_RELEASE_KEY_ALIAS: ${{ secrets.MAEYAI_RELEASE_KEY_ALIAS }}
      MAEYAI_RELEASE_KEY_PASSWORD: ${{ secrets.MAEYAI_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" && -d "$SDK_ROOT/cmdline-tools" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate and install protected release keystore
        shell: bash
        env:
          EXPECTED_RELEASE_SHA1: 4a17ccca25dea7bcb7cee2ec9b78742fd1bccb47
        run: |
          set -euo pipefail
          for name in MAEYAI_RELEASE_KEYSTORE_BASE64 MAEYAI_RELEASE_STORE_PASSWORD MAEYAI_RELEASE_KEY_ALIAS MAEYAI_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/maeyai-pos-release.p12"
          printf '%s' "$MAEYAI_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -v -storetype PKCS12 -keystore "$KEYSTORE" \
            -storepass "$MAEYAI_RELEASE_STORE_PASSWORD" \
            -alias "$MAEYAI_RELEASE_KEY_ALIAS" > "$RUNNER_TEMP/release-cert.txt"
          ACTUAL_SHA1="$(awk -F': ' '/SHA1:/{gsub(":","",$2); print tolower($2)}' "$RUNNER_TEMP/release-cert.txt")"
          if [[ "$ACTUAL_SHA1" != "$EXPECTED_RELEASE_SHA1" ]]; then
            echo "::error::Release keystore SHA-1 does not match the approved certificate."
            exit 1
          fi
          {
            echo "MAEYAI_RELEASE_STORE_FILE=$KEYSTORE"
            echo "MAEYAI_RELEASE_SHA1=$ACTUAL_SHA1"
          } >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble signed release APK
        env:
          MAEYAI_RELEASE_STORE_PASSWORD: ${{ secrets.MAEYAI_RELEASE_STORE_PASSWORD }}
          MAEYAI_RELEASE_KEY_ALIAS: ${{ secrets.MAEYAI_RELEASE_KEY_ALIAS }}
          MAEYAI_RELEASE_KEY_PASSWORD: ${{ secrets.MAEYAI_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon --no-build-cache :app:assembleRelease

      - name: Verify release APK signature and certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/apk-cert.txt"
          APK_SHA1="$(awk '/certificate SHA-1 digest:/{print tolower($NF)}' "$RUNNER_TEMP/apk-cert.txt")"
          if [[ "$APK_SHA1" != "$MAEYAI_RELEASE_SHA1" ]]; then
            echo "::error::Release APK certificate does not match the protected release keystore."
            exit 1
          fi
          echo "Release APK signature verified. SHA-1: $APK_SHA1"

      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mae-yai-on-pos-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/maeyai-pos-release.p12" "$RUNNER_TEMP/release-cert.txt" "$RUNNER_TEMP/apk-cert.txt"
